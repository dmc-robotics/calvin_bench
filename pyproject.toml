[project]
name = "calvin-bench"
version = "0.1.0"
description = "Actuator characterization tools for Calvin"
requires-python = ">=3.12"
dependencies = [
    "pyserial",
    "numpy",
    "scipy",
    "matplotlib",
    "odrive",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bench"]
